[package]
name = "lfff"
version = "0.2.0"
edition = "2024"
description = "Free, open-source firmware flasher for Android A/B devices via fastboot"
license = "GPL-3.0"
repository = "https://github.com/mrFrok/LibreFastbootFirmwareFlasher"

[[bin]]
name = "lfff"
path = "src/main.rs"

[lib]
name = "lfff"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
digest = "0.10"
indicatif = "0.17"
colored = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
