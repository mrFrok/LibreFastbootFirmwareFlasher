[package]
name = "lfff-lib"
version = "2.1.0"
edition = "2024"
description = "Core library for LibreFastbootFirmwareFlasher"
license = "GPL-3.0"
repository = "https://github.com/mrFrok/LibreFastbootFirmwareFlasher"

[lib]
name = "lfff_lib"
path = "src/lib.rs"

[dependencies]
 anyhow = "1"
 thiserror = "2"
 tracing = "0.1"
 sha2 = "0.10"
digest = "0.10"
regex = "1"
which = "8"
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
colored = "3"
wait-timeout = "0.2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
