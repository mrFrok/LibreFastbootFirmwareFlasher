[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LibreFastbootFirmwareFlasher"
version = "0.1.2"
description = "CLI tool for extracting and flashing Android firmware via fastboot"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"

# No heavy PyPI dependencies — external tools (fastboot, adb, payload-dumper-go)
# are called via subprocess. argcomplete is optional but recommended for shell completion.
dependencies = ["argcomplete>=3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flasher", "flasher.*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# ---------------------------------------------------------------------------
# ruff (optional linter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
