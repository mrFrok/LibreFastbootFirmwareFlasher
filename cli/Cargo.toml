[package]
name = "lfff-cli"
version = "2.7.2"
edition = "2024"
description = "CLI frontend for LibreFastbootFirmwareFlasher"
license = "GPL-3.0"

[[bin]]
name = "lfff"
path = "src/main.rs"

[dependencies]
lfff-lib = { path = "../lib" }
 clap = { version = "4", features = ["derive"] }
 tracing = "0.1"
 tracing-subscriber = { version = "0.3", features = ["env-filter"] }
  colored = "3"
  indicatif = "0.18"
  zip = { version = "8", default-features = false, features = ["deflate"] }
clap_complete = "4.6.9"
clap_complete_nushell = "4.6.2"

[dev-dependencies]
assert_cmd = "2"
