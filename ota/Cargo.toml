[package]
name = "lfff-ota"
version = "3.2.0"
edition = "2024"
description = "Asks the OPPO / OnePlus / realme update servers for official firmware"
license = "GPL-3.0"
repository = "https://github.com/mrFrok/LibreFastbootFirmwareFlasher"

[lib]
name = "lfff_ota"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tracing = "0.1"
serde_json = "1"
base64 = "0.22"
aes = "0.8"
ctr = "0.9"
rsa = "0.9"
sha1 = "0.10"
rand = "0.8"
