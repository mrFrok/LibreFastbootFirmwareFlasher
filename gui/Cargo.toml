[package]
name = "lfff-gui"
version = "3.7.1"
edition = "2024"
description = "GUI frontend for LibreFastbootFirmwareFlasher"
license = "GPL-3.0"

[[bin]]
name = "lfff-gui"
path = "src/main.rs"

[features]
# Skia only — the BSD build has no Skia, so `--features vulkan` is not
# available there (see the target section below).
vulkan = ["slint/renderer-skia-vulkan"]

[dependencies]
slint = { version = "1.19.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
lfff-lib = { path = "../lib" }
lfff-ota = { path = "../ota" }
rfd = "0.17"
arboard = "3"
dirs = "7"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
reqwest = { version = "0.13", features = ["blocking", "json"] }

# Skia has no BSD build: skia-safe's build script rejects any target outside
# Linux, macOS, Windows and Android, and the upstream FreeBSD support PR is
# still open. The BSDs therefore get the software renderer only, which winit
# drives through softbuffer — no Skia, no OpenGL, just the X11 surface.
[target.'cfg(not(any(target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly")))'.dependencies]
slint = { version = "1.19.1", default-features = false, features = ["renderer-skia"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Blocks sleep through the desktop when there is no logind (worker.rs NoSleep).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
slint-build = "1.19.1"
