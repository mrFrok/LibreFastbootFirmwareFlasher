[package]
name = "lfff-gui"
version = "2.7.1"
edition = "2024"
description = "GUI frontend for LibreFastbootFirmwareFlasher"
license = "GPL-3.0"

[[bin]]
name = "lfff-gui"
path = "src/main.rs"

[features]
vulkan = ["slint/renderer-skia-vulkan"]

[dependencies]
slint = { version = "1.17.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "renderer-software", "accessibility"] }
lfff-lib = { path = "../lib" }
rfd = "0.17"
arboard = "3"
dirs = "6"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
reqwest = { version = "0.13", features = ["blocking", "json"] }

[build-dependencies]
slint-build = "1.17.0"
