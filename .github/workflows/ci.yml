name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt -- --check
      # GUI is excluded: compiling Slint + Skia takes too long for PR CI.
      # It is still built by release.yml on tags.
      - name: Clippy (deny warnings)
        run: cargo clippy -p lfff-lib -p lfff-ota -p lfff-cli --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p lfff-lib -p lfff-ota -p lfff-cli
      - name: Packaging script tests
        run: |
          python3 scripts/test_update_packaging.py
          python3 scripts/test_release_notes.py
      # Caught here rather than at the tag: the release job refuses to publish
      # a version without notes.
      - name: CHANGELOG.md has notes for this version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)
          python3 scripts/release-notes.py "$version" > /dev/null

  # Nobody on the project has a Mac, so this is where macOS-only code gets
  # exercised at all. The runners have Homebrew, zsh and the /usr/bin/apt Java
  # stub — the environment both v2.9.4 macOS bugs lived in.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test -p lfff-lib -p lfff-ota -p lfff-cli
      # Only the GUI's PATH handling: the rest of the GUI has no tests, and
      # this module is the macOS-specific part.
      - name: GUI PATH handling
        run: cargo test -p lfff-gui env_path
      # The published tap against the published release, the way a user
      # installs it. The formula lives in mrFrok/homebrew-lfff and the packaging
      # job only rewrites its versions and hashes, so this is the only place
      # its install logic ever runs before a user hits it.
      - name: Homebrew install from the tap (cask and formula)
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew tap mrFrok/lfff
          # Current Homebrew refuses formulae from third-party taps until
          # they are trusted; older releases have no `brew trust` at all.
          if brew trust --help >/dev/null 2>&1; then brew trust mrfrok/lfff; fi
          # The cask pulls in the formula, so this one command is the whole
          # install a user does.
          brew install --cask librefastbootfirmwareflasher
          lfff --version
          test -x "$(brew --prefix)/bin/lfff-gui"
          test -d /Applications/LibreFastbootFirmwareFlasher.app
          # Not notarised, so the cask must have taken the quarantine off.
          if xattr /Applications/LibreFastbootFirmwareFlasher.app | grep -q com.apple.quarantine; then
            echo "::error::the app is still quarantined"
            exit 1
          fi
          brew test lfff

  slint-format:
    runs-on: ubuntu-latest
    env:
      # Same version as the slint dependency: the formatter's output can
      # change between releases. Bump the two together.
      SLINT_VERSION: 1.18.1
      SLINT_LSP_SHA256: 62735d2b1908ae8a33b35dcdc71fd0c713f44ef8a4a9b57e8dfa07319903eefa
    steps:
      - uses: actions/checkout@v4
      - name: Install slint-lsp
        run: |
          # The release binary links its live-preview stack even when only
          # formatting; the runner image lacks libinput and libgbm.
          sudo apt-get update -qq
          sudo apt-get install -y libinput10 libgbm1 libxkbcommon0 libfontconfig1 libfreetype6
          curl -fsSLo slint-lsp.tar.gz \
            "https://github.com/slint-ui/slint/releases/download/v$SLINT_VERSION/slint-lsp-linux.tar.gz"
          echo "$SLINT_LSP_SHA256  slint-lsp.tar.gz" | sha256sum -c -
          tar xzf slint-lsp.tar.gz -C "$RUNNER_TEMP"
      # gui/material-* is vendored upstream code and stays as shipped.
      - name: Check .slint formatting
        run: |
          find gui/ui -name '*.slint' -exec "$RUNNER_TEMP/slint-lsp/slint-lsp" format -i {} +
          if ! git diff --exit-code -- gui/ui; then
            echo "::error::.slint files are not formatted. Run: slint-lsp format -i <file>.slint"
            exit 1
          fi
