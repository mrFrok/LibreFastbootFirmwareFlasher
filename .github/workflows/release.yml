name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli:
    name: CLI — ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p lfff-cli

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lfff dist/
          cd dist
          tar czf lfff-${{ matrix.name }}.tar.gz lfff
          sha256sum lfff-${{ matrix.name }}.tar.gz > lfff-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/lfff-${{ matrix.name }}.tar.gz*

  build-gui:
    name: GUI — ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.target }}

      - name: Install Linux system dependencies
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libdbus-1-dev \
            pkg-config

      - name: Build GUI
        run: cargo build --release --target ${{ matrix.target }} -p lfff-gui

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lfff-gui dist/
          cd dist
          tar czf lfff-gui-${{ matrix.name }}.tar.gz lfff-gui
          sha256sum lfff-gui-${{ matrix.name }}.tar.gz > lfff-gui-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.name }}
          path: dist/lfff-gui-${{ matrix.name }}.tar.gz*

  release:
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach desktop & icon files
        run: |
          cp lfff-gui.desktop artifacts/
          cp lfff-gui.svg artifacts/
          cp install.sh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
