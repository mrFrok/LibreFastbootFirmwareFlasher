name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # Re-point the packaging at a release that already exists, without cutting a
  # new tag. Only the jobs below `release` run.
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to point the packaging at, e.g. 2.8.0'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli:
    name: CLI — ${{ matrix.name }}
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          # musl, not gnu: a static binary runs on any Linux — glibc distros,
          # musl ones like Void and Alpine, and Termux on Android, which has
          # neither. The asset names stay the same, so nothing downstream moves.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            name: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}


      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p lfff-cli

      # README promises a static binary, and a program interpreter is exactly
      # what broke Termux (#13), so fail rather than ship one that has it.
      # Static, not necessarily static-pie: rustc only builds static-pie where
      # the target allows it (x86_64 musl does, aarch64 musl does not yet), and
      # Android's PIE-only rule lives in its dynamic linker, which a static
      # binary never goes through — the kernel runs it directly.
      - name: Check the binary is static
        if: contains(matrix.target, 'linux')
        run: |
          bin=target/${{ matrix.target }}/release/lfff
          file "$bin"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "error: $bin needs a program interpreter, it is not static" >&2
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lfff dist/
          cd dist
          tar czf lfff-${{ matrix.name }}.tar.gz lfff
          sha256sum lfff-${{ matrix.name }}.tar.gz > lfff-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/lfff-${{ matrix.name }}.tar.gz*

  build-gui:
    name: GUI — ${{ matrix.name }}
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu LTS, not the newest: a binary needs
          # at least the glibc it was built against, so building on 24.04
          # (glibc 2.39) shut out Debian 12, Ubuntu 22.04 and the like. Same
          # rule the AppImage catalog checks for.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            name: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}


      - name: Install Linux system dependencies
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libdbus-1-dev \
            pkg-config

      - name: Build GUI
        run: cargo build --release --target ${{ matrix.target }} -p lfff-gui

      - name: Package (macOS .app)
        if: contains(matrix.name, 'macos')
        env:
          # Through env, not ${{ }} in the script: a tag name may contain
          # quotes and $, and would otherwise be spliced into the shell.
          TAG: ${{ github.ref_name }}
        run: |
          brew install librsvg
          APP="LibreFastbootFirmwareFlasher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          cp "target/${{ matrix.target }}/release/lfff-gui" "$APP/Contents/MacOS/lfff-gui"
          cp gui/macOS/Info.plist "$APP/Contents/Info.plist"
          sed -i '' 's/\$(CARGO_PKG_VERSION)/'"$TAG"'/' "$APP/Contents/Info.plist"
          # Generate .icns from app icon
          mkdir -p AppIcon.iconset
          for size in 16 32 128 256 512; do
            rsvg-convert -w $size -h $size lfff-gui.svg \
              > "AppIcon.iconset/icon_${size}x${size}.png"
            rsvg-convert -w $((size*2)) -h $((size*2)) lfff-gui.svg \
              > "AppIcon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          mv "$APP" dist/
          cd dist
          tar czf lfff-gui-${{ matrix.name }}.tar.gz "LibreFastbootFirmwareFlasher.app"
          sha256sum lfff-gui-${{ matrix.name }}.tar.gz > lfff-gui-${{ matrix.name }}.tar.gz.sha256

      - name: Package (Linux)
        if: contains(matrix.name, 'linux')
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lfff-gui dist/
          cd dist
          tar czf lfff-gui-${{ matrix.name }}.tar.gz lfff-gui
          sha256sum lfff-gui-${{ matrix.name }}.tar.gz > lfff-gui-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.name }}
          path: dist/lfff-gui-${{ matrix.name }}.tar.gz*


  # GUI for musl distributions (Void, Alpine) — a dynamically linked musl
  # build alongside the glibc one, since each only runs on its own libc.
  # scripts/build-gui-musl.sh explains why it is dynamic and built in Alpine.
  #
  # The build runs through `docker run` rather than `container:` because
  # JavaScript actions (checkout, upload-artifact) do not run inside Alpine
  # containers on arm64 runners. It also means the exact same script is what
  # gets tested locally.
  build-gui-musl:
    name: GUI musl — ${{ matrix.arch }}
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Built on main by musl-gui-cache.yml; a tag run cannot save a cache
      # the next tag could read, so this only restores. Same key and paths.
      - uses: actions/cache/restore@v4
        with:
          path: |
            target/musl
            target/musl-cargo/registry/index
            target/musl-cargo/registry/cache
            target/musl-cargo/git/db
          key: musl-gui-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'scripts/build-gui-musl.sh') }}
          restore-keys: musl-gui-${{ matrix.arch }}-

      - name: Build GUI in Alpine
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:alpine \
            scripts/build-gui-musl.sh "$(id -u):$(id -g)"

      - name: Package
        run: |
          mkdir -p dist
          cp target/musl/release/lfff-gui dist/
          cd dist
          tar czf lfff-gui-linux-${{ matrix.arch }}-musl.tar.gz lfff-gui
          sha256sum lfff-gui-linux-${{ matrix.arch }}-musl.tar.gz \
            > lfff-gui-linux-${{ matrix.arch }}-musl.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-musl-${{ matrix.arch }}
          path: dist/lfff-gui-linux-${{ matrix.arch }}-musl.tar.gz*

  package-appimage:
    name: AppImage — ${{ matrix.arch }}
    needs: [build-cli, build-gui]
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-linux-${{ matrix.arch }}'
          path: artifacts
          merge-multiple: true

      # linuxdeploy resolves what to bundle with ldd, so the GUI's runtime
      # libraries have to be present here even though nothing is compiled.
      - name: Install the runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-xkb1 \
            libfontconfig1 libfreetype6 libgl1 libegl1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libx11-6 libx11-xcb1 libxcursor1 libxi6 libxrandr2 libxcb1 libdbus-1-3 \
            librsvg2-bin

      - name: Assemble the AppDir
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin
          tar xzf artifacts/lfff-gui-linux-${{ matrix.arch }}.tar.gz -C AppDir/usr/bin
          tar xzf artifacts/lfff-linux-${{ matrix.arch }}.tar.gz     -C AppDir/usr/bin
          chmod +x AppDir/usr/bin/lfff-gui AppDir/usr/bin/lfff

      - name: Build the AppImage
        env:
          # No FUSE on the runners, so the tools unpack themselves instead.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          ARCH: ${{ matrix.arch }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Pinned releases with checked hashes, not the moving "continuous"
          # build: these tools run here and package what ships, so a swapped
          # upstream binary would poison the published AppImage.
          ld_tag=1-alpha-20251107-1
          plugin_tag=1-alpha-20250213-1
          case "$ARCH" in
            x86_64)
              ld_sha=c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
              plugin_sha=992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3 ;;
            aarch64)
              ld_sha=620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff
              plugin_sha=83c292149274965a865dcd44c135cfca8ba28c6b7de3eb628d4b8b5f248af17c ;;
          esac
          curl -fsSLo linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$ld_tag/linuxdeploy-${ARCH}.AppImage"
          curl -fsSLo linuxdeploy-plugin-appimage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/$plugin_tag/linuxdeploy-plugin-appimage-${ARCH}.AppImage"
          printf '%s  %s\n' "$ld_sha" linuxdeploy "$plugin_sha" linuxdeploy-plugin-appimage \
            | sha256sum -c -
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          export PATH="$PWD:$PATH"
          # The windowing libraries are dlopen'd, not linked, so ldd — and
          # with it linuxdeploy — never sees them. Without them bundled the
          # AppImage panics on any system lacking libxkbcommon-x11, which is
          # how the AppImage catalog's test caught it. libGL/libEGL stay
          # out on purpose: they must match the host's GPU driver, and so do
          # libxcb, libX11-xcb and the wayland libraries, which the AppImage
          # excludelist forbids bundling for the same reason.
          dlopened=()
          for lib in libxkbcommon.so.0 libxkbcommon-x11.so.0 libxcb-xkb.so.1 \
                     libXcursor.so.1 libXi.so.6 libXrandr.so.2; do
            path=$(ldconfig -p | awk -v l="$lib" '$1 == l { print $NF; exit }')
            [ -n "$path" ] || { echo "error: $lib not installed" >&2; exit 1; }
            dlopened+=(--library "$path")
          done
          # A PNG icon as well: AppImage tooling uses it for thumbnails.
          rsvg-convert -w 256 -h 256 lfff-gui.svg -o lfff-gui.png
          # linuxdeploy matches the icon to the desktop file's Icon= key.
          ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/lfff-gui \
            "${dlopened[@]}" \
            --desktop-file lfff-gui.desktop \
            --icon-file lfff-gui.png \
            --icon-file lfff-gui.svg \
            --output appimage
          mkdir -p dist
          # Named the way the AppImage catalog expects: no "linux" (every
          # AppImage is), and the version in the name.
          name="LibreFastbootFirmwareFlasher-${TAG#v}-${ARCH}.AppImage"
          mv ./*.AppImage "dist/$name"
          cd dist
          sha256sum "$name" > "$name.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/LibreFastbootFirmwareFlasher-*-${{ matrix.arch }}.AppImage*

  release:
    needs: [build-cli, build-gui, build-gui-musl, package-appimage]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Downstream packaging. Each of these points a package manager at the release
  # that was just published, so none of them can run before the assets exist —
  # the checksums are read from the `.sha256` sidecars uploaded above.
  #
  # `needs: release` with `always()` is what lets a manual dispatch skip the
  # build jobs and re-run only this half for a release that already exists.
  # ---------------------------------------------------------------------------

  packaging-nix:
    name: Packaging — flake.nix
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      # The tag itself can never carry these hashes — they only exist once the
      # binaries are built — so the update lands on main, which is what
      # `nix run github:mrFrok/LibreFastbootFirmwareFlasher` follows.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point the in-repo packaging at the new release
        env:
          APP_ID: io.github.mrFrok.LibreFastbootFirmwareFlasher
        run: |
          python3 scripts/update-packaging.py --version "$VERSION" \
            --flake flake.nix \
            --flatpak "packaging/flatpak/$APP_ID.yml" \
            --metainfo "packaging/flatpak/$APP_ID.metainfo.xml"

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "already up to date"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(packaging): point at ${VERSION#v}"
          git push

  packaging-aur:
    name: Packaging — AUR
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # .SRCINFO is generated by makepkg, which only exists on Arch.
    container: archlinux:base-devel
    env:
      VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh python

      - uses: actions/checkout@v4
        with:
          path: src

      - name: Authenticate to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -dm700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          # Pinned, not keyscanned: trust-on-first-use in CI trusts whatever
          # answers, which defeats the point of checking a host key at all.
          printf '%s\n' \
            'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > "$HOME/.ssh/known_hosts"

      - name: Publish
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git config --global --add safe.directory '*'

          git clone ssh://aur@aur.archlinux.org/lfff.git     aur-lfff
          git clone ssh://aur@aur.archlinux.org/lfff-bin.git aur-lfff-bin

          python3 src/scripts/update-packaging.py --version "$VERSION" \
            --aur-src aur-lfff/PKGBUILD --aur-bin aur-lfff-bin/PKGBUILD

          # makepkg refuses to run as root, even just to print .SRCINFO.
          useradd -m builder
          chown -R builder aur-lfff aur-lfff-bin

          for dir in aur-lfff aur-lfff-bin; do (
            cd "$dir"
            sudo -u builder makepkg --printsrcinfo > .SRCINFO
            if git diff --quiet; then
              echo "$dir already up to date"
              exit 0
            fi
            # Keep whoever has been maintaining the package as the committer.
            git config user.name  "$(git log -1 --format='%an')"
            git config user.email "$(git log -1 --format='%ae')"
            # Named paths only: a `git add -A` here would sweep in makepkg's
            # downloads and build output.
            git commit -m "Update to ${VERSION#v}" -- PKGBUILD .SRCINFO
            git push
          ); done

  packaging-homebrew:
    name: Packaging — Homebrew
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      # A deploy key rather than a PAT: it is scoped to this one repository,
      # cannot touch anything else on the account, and does not expire.
      - uses: actions/checkout@v4
        with:
          repository: mrFrok/homebrew-lfff
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Point the formula at the new release
        run: |
          python3 src/scripts/update-packaging.py --version "$VERSION" \
            --formula tap/Formula/lfff.rb

      - name: Commit
        working-directory: tap
        run: |
          if git diff --quiet; then
            echo "formula already up to date"
            exit 0
          fi
          git config user.name  "$(git log -1 --format='%an')"
          git config user.email "$(git log -1 --format='%ae')"
          git commit -m "lfff ${VERSION#v}" -- Formula/lfff.rb
          git push

  packaging-flatpak:
    name: Packaging — Flatpak
    needs: [release, packaging-nix]
    if: always() && needs.packaging-nix.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      APP_ID: io.github.mrFrok.LibreFastbootFirmwareFlasher

    steps:
      # packaging-nix has already committed the repointed manifest to main.
      - uses: actions/checkout@v4
        with:
          ref: main

      # Installed here rather than pulled as a prebuilt action container: the
      # published ones stop at freedesktop 24.08, and this keeps the runtime
      # version a decision of the manifest rather than of someone's image tag.
      - name: Install flatpak and the runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          # Read from the manifest, so the two cannot drift apart.
          runtime=$(sed -n "s/^runtime-version: *'\([^']*\)'.*/\1/p" \
            "packaging/flatpak/$APP_ID.yml")
          [ -n "$runtime" ] || { echo "no runtime-version in the manifest"; exit 1; }
          echo "runtime: $runtime"
          flatpak remote-add --user --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            "org.freedesktop.Platform//$runtime" "org.freedesktop.Sdk//$runtime"

      - name: Build the bundle
        run: |
          set -euo pipefail
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=repo build "packaging/flatpak/${APP_ID}.yml"
          flatpak build-bundle repo "lfff-gui-linux-x86_64.flatpak" "$APP_ID"
          sha256sum "lfff-gui-linux-x86_64.flatpak" > "lfff-gui-linux-x86_64.flatpak.sha256"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VERSION#v}" \
            lfff-gui-linux-x86_64.flatpak \
            lfff-gui-linux-x86_64.flatpak.sha256 --clobber
